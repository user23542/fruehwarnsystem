name: Frühwarnsystem — Quellencheck und Website

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '23 7 8 * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fruehwarnsystem-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Quellen auf technische Änderungen prüfen
        run: python scripts/check_sources.py
      - name: Ergebnis der Quellenprüfung versionieren
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/monitor.json
          if ! git diff --cached --quiet; then
            git commit -m 'Quellencheck aktualisieren'
            git push
          fi
      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5
      - name: Website verpacken
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
